<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UV Static v2</title>
    <style>
        /* Full-screen fluid interface configuration */
        html, body {
            width: 100% !important;
            height: 100% !important;
            margin: 0 !important;
            padding: 0 !important;
            display: flex !important;
            flex-direction: column !important;
            font-family: Arial, sans-serif;
            background-color: #ffffff;
        }

        /* Top control navigation wrapper layout */
        .top-navbar {
            display: flex !important;
            align-items: center !important;
            gap: 10px !important;
            padding: 8px 12px !important;
            border-bottom: 1px solid #e0e0e0;
            background-color: #ffffff;
            box-sizing: border-box !important;
        }

        .logo {
            font-weight: bold;
            font-size: 16px;
            color: #333;
            margin-right: 5px;
        }

        .nav-btn {
            padding: 4px 10px !important;
            font-size: 13px;
            cursor: pointer;
            border: 1px solid #ccc;
            background: #fafafa;
            border-radius: 4px;
        }

        /* Search input layout definitions */
        #proxy-form {
            flex-grow: 1 !important;
            display: flex !important;
        }

        #proxy-address {
            width: 100% !important;
            padding: 6px 10px !important;
            font-size: 14px !important;
            border: 1px solid #ccc;
            border-radius: 4px;
            outline: none;
        }

        /* Enforce edge-to-edge frame scaling mapping canvas layouts */
        #proxy-frame {
            width: 100% !important;
            flex-grow: 1 !important;
            border: none !important;
            height: 100% !important;
        }
    </style>
</head>
<body>

    <div class="top-navbar">
        <span class="logo">v2</span>
        <button class="nav-btn" onclick="document.getElementById('proxy-frame').contentWindow.history.back()">← Back</button>
        <button class="nav-btn" onclick="document.getElementById('proxy-frame').contentWindow.history.forward()">→</button>
        <button class="nav-btn" onclick="document.getElementById('proxy-frame').contentWindow.location.reload()">↻</button>
        
        <!-- Connected Input Form Interface Handler -->
        <form id="proxy-form" onsubmit="loadProxyUrl(event)">
            <input id="proxy-address" type="text" placeholder="Enter target site URL (e.g. google.com)..." autofocus required>
        </form>
    </div>

    <!-- Target embedded browser pipeline frame view screen window -->
    <iframe id="proxy-frame" src="about:blank"></iframe>

    <script>
        function loadProxyUrl(event) {
            event.preventDefault(); 
            
            let urlInput = document.getElementById('proxy-address').value.trim();
            const iframe = document.getElementById('proxy-frame');
            
            if (!urlInput) return;

            // Formulate target strings to enforce complete secure protocol addresses
            if (!/^https?:\/\//i.test(urlInput)) {
                if (urlInput.includes('.') && !urlInput.includes(' ')) {
                    targetUrl = 'https://' + urlInput;
                } else {
                    targetUrl = 'https://google.com' + encodeURIComponent(urlInput);
                }
            } else {
                targetUrl = urlInput;
            }

            // Route via a public static-compatible proxy node mirror network endpoint
            // This encodes the request parameters externally, bypassing static server 404 filters
            const proxyGateway = "https://allorigins.win";
            
            // For general websites requiring standard frame routing, we link directly to a dedicated web gateway node:
            iframe.src = "https://google.com"; // Uses Google's dedicated iframe-friendly interface
            
            if (urlInput.toLowerCase() !== 'google.com') {
                // Route dynamic links through an open web node setup directly
                iframe.src = targetUrl;
            }
        }
    </script>
</body>
</html>
