<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UV Static v2</title>
    <style>
        /* Force wide full-screen responsive spacing layouts */
        html, body {
            width: 100% !important;
            height: 100% !important;
            margin: 0 !important;
            padding: 0 !important;
            display: flex !important;
            flex-direction: column !important;
            font-family: Arial, sans-serif;
            background-color: #ffffff;
        }

        /* Top address navbar container spacing layout */
        .top-navbar {
            display: flex !important;
            align-items: center !important;
            gap: 10px !important;
            padding: 8px 12px !important;
            border-bottom: 1px solid #e0e0e0;
            background-color: #ffffff;
            box-sizing: border-box !important;
        }

        .logo {
            font-weight: bold;
            font-size: 16px;
            color: #333;
            margin-right: 5px;
        }

        .nav-btn {
            padding: 4px 10px !important;
            font-size: 13px;
            cursor: pointer;
            border: 1px solid #ccc;
            background: #fafafa;
            border-radius: 4px;
        }

        /* Allow proxy search submission block to stretch horizontally */
        #uv-form {
            flex-grow: 1 !important;
            display: flex !important;
        }

        /* Scale submission text field box wide across screens */
        #uv-address {
            width: 100% !important;
            padding: 6px 10px !important;
            font-size: 14px !important;
            border: 1px solid #ccc;
            border-radius: 4px;
            outline: none;
        }

        /* Force display panel window canvas to utilize all empty screen room */
        #uv-frame {
            width: 100% !important;
            flex-grow: 1 !important;
            border: none !important;
            height: 100% !important;
        }
    </style>
</head>
<body>

    <div class="top-navbar">
        <span class="logo">v2</span>
        <button class="nav-btn" onclick="document.getElementById('uv-frame').contentWindow.history.back()">← Back</button>
        <button class="nav-btn" onclick="document.getElementById('uv-frame').contentWindow.history.forward()">→</button>
        <button class="nav-btn" onclick="document.getElementById('uv-frame').contentWindow.location.reload()">↻</button>
        
        <!-- Connected Proxy Form Component Block with explicit Javascript inline override -->
        <form id="uv-form" onsubmit="handleProxySearch(event)">
            <input id="uv-address" type="text" placeholder="Search Google or enter target URL..." autofocus required>
        </form>
    </div>

    <!-- Active output frame rendering targeted sites -->
    <iframe id="uv-frame"></iframe>

    <!-- Core asset dependencies routed explicitly to /active/ subdirectory maps -->
    <script src="/active/uv/uv.bundle.js" defer></script>
    <script src="/active/uv/uv.config.js" defer></script>

    <script>
        // Inline execution handler that forces text parsing through Ultraviolet pipeline
        function handleProxySearch(event) {
            event.preventDefault(); // STOPS the generic form reload ? glitch
            
            const urlInput = document.getElementById('uv-address').value.trim();
            const iframe = document.getElementById('uv-frame');
            
            if (!urlInput) return;

            // Determine if the entry is a direct link or raw search keywords
            let targetUrl = urlInput;
            if (!/^https?:\/\//i.test(urlInput) && !urlInput.includes('.')) {
                targetUrl = 'https://google.com' + encodeURIComponent(urlInput);
            } else if (!/^https?:\/\//i.test(urlInput)) {
                targetUrl = 'https://' + urlInput;
            }

            // Encode using Ultraviolet's internal static translation mapping pipeline
            if (typeof __uv$config !== 'undefined' && window.__uv$config) {
                iframe.src = window.location.origin + window.__uv$config.prefix + __uv$config.encodeUrl(targetUrl);
            } else {
                // Absolute structural path fallback if config hasn't globally loaded yet
                iframe.src = window.location.origin + "/active/uv/service/" + btoa(targetUrl).replace(/\//g, '_').replace(/\+/g, '-').replace(/=/g, '');
            }
        }
    </script>
</body>
</html>
