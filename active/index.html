<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UV Static v2</title>
    <style>
        /* Modern Dark Mode theme with full-screen layouts */
        html, body {
            width: 100% !important;
            height: 100% !important;
            margin: 0 !important;
            padding: 0 !important;
            display: flex !important;
            flex-direction: column !important;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            overflow: hidden;
        }

        /* Top control header panel layout stretching side-to-side */
        .top-navbar {
            display: flex !important;
            align-items: center !important;
            gap: 10px !important;
            padding: 10px 16px !important;
            border-bottom: 1px solid #2d2d2d;
            background-color: #1a1a1a;
            box-sizing: border-box !important;
        }

        .logo {
            font-weight: bold;
            font-size: 16px;
            color: #bb86fc;
            margin-right: 5px;
        }

        .nav-btn {
            padding: 6px 12px !important;
            font-size: 13px;
            cursor: pointer;
            border: 1px solid #3d3d3d;
            background: #252525;
            color: #e0e0e0;
            border-radius: 6px;
        }

        /* Search form fluid horizontal alignment */
        #search-form {
            flex-grow: 1 !important;
            display: flex !important;
        }

        #search-address {
            width: 100% !important;
            padding: 8px 14px !important;
            font-size: 14px !important;
            border: 1px solid #3d3d3d;
            background-color: #252525;
            color: #ffffff;
            border-radius: 6px;
            outline: none;
        }

        #search-address:focus {
            border-color: #bb86fc;
        }

        /* Force display panel viewport window canvas to fill up 100% space */
        #display-frame {
            width: 100% !important;
            flex-grow: 1 !important;
            border: none !important;
            height: 100% !important;
            background-color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="top-navbar">
        <span class="logo">v2</span>
        <button class="nav-btn" onclick="document.getElementById('display-frame').contentWindow.history.back()">← Back</button>
        <button class="nav-btn" onclick="document.getElementById('display-frame').contentWindow.history.forward()">→</button>
        <button class="nav-btn" onclick="document.getElementById('display-frame').contentWindow.location.reload()">↻</button>
        
        <form id="search-form" onsubmit="executeWebSearch(event)">
            <input id="search-address" type="text" placeholder="Type query keywords or copy game urls..." autofocus required>
        </form>
    </div>

    <!-- Clean fallback welcome home screen inside iframe to avoid immediate error triggering -->
    <iframe id="display-frame" src="https://bing.com"></iframe>

    <script>
        function executeWebSearch(event) {
            event.preventDefault(); // Prevents repetitive loops from breaking
            
            let queryInput = document.getElementById('search-address').value.trim();
            const iframe = document.getElementById('display-frame');
            
            if (!queryInput) return;

            // Route search queries natively through Bing to prevent Google 429 errors
            let cleanString = queryInput.replace(/^https?:\/\//i, '').replace(/^www\./i, '');
            
            if (queryInput.includes('.') && !queryInput.includes(' ')) {
                // If it is a direct game url like coolmathgames.com, let it load natively
                iframe.src = "https://" + cleanString;
            } else {
                // Open lookups safely inside a web frame
                iframe.src = "https://bing.com" + encodeURIComponent(queryInput);
            }
        }
    </script>
</body>
</html>
