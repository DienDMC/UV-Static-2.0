<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UV Static v2</title>
    <link rel="stylesheet" href="style/global.css">
    <link rel="stylesheet" href="style/browser.css">
    <style>
        /* Force layout out of the top-left corner and stretch it full screen */
        html, body {
            width: 100% !important;
            height: 100% !important;
            margin: 0 !important;
            padding: 0 !important;
            display: flex !important;
            flex-direction: column !important;
            font-family: sans-serif;
            background-color: #fff;
        }

        /* Top controls section wrapper stretching side-to-side */
        .header-container {
            display: flex !important;
            flex-wrap: wrap !important;
            width: 100% !important;
            align-items: center !important;
            gap: 15px !important;
            padding: 10px !important;
            box-sizing: border-box !important;
            border-bottom: 1px solid #ccc;
        }

        /* Force the navigation search bar to grow wide across the screen */
        input[type="text"], .search-bar, #url-bar {
            flex-grow: 1 !important;
            min-width: 200px !important;
            padding: 8px !important;
            font-size: 14px;
        }

        /* Navigation control buttons horizontal layout alignment */
        .nav-buttons {
            display: flex !important;
            gap: 5px !important;
        }

        /* Force the web view proxy panel to take up all remaining white space */
        iframe, #iframe, #web-viewer, main {
            width: 100% !important;
            flex-grow: 1 !important;
            border: none !important;
            height: 100% !important;
        }
    </style>
</head>
<body>

    <div class="header-container">
        <h1 style="margin:0; font-size:24px; color:#4a154b;">v2</h1>
        
        <div class="nav-buttons">
            <button id="back-btn">← Back</button>
            <button id="forward-btn">→</button>
            <button id="refresh-btn">↻</button>
            <button id="menu-btn">≡</button>
        </div>

        <input type="text" id="url-bar" placeholder="Search or enter URL...">
    </div>

    <!-- The background webview system window -->
    <iframe id="web-viewer" src="about:blank"></iframe>

    <script src="scripts/index.js" defer></script>
</body>
</html>
