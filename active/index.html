<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UV Static v2</title>
    <style>
        /* Responsive edge-to-edge full layout container rules */
        html, body {
            width: 100% !important;
            height: 100% !important;
            margin: 0 !important;
            padding: 0 !important;
            display: flex !important;
            flex-direction: column !important;
            font-family: Arial, sans-serif;
            background-color: #ffffff;
        }

        /* Top address controls bar panel wrapper rules */
        .top-navbar {
            display: flex !important;
            align-items: center !important;
            gap: 10px !important;
            padding: 8px 12px !important;
            border-bottom: 1px solid #e0e0e0;
            background-color: #ffffff;
            box-sizing: border-box !important;
        }

        .logo {
            font-weight: bold;
            font-size: 16px;
            color: #333;
            margin-right: 5px;
        }

        .nav-btn {
            padding: 4px 10px !important;
            font-size: 13px;
            cursor: pointer;
            border: 1px solid #ccc;
            background: #fafafa;
            border-radius: 4px;
        }

        /* Search input bar horizontal structural growth configuration */
        #proxy-form {
            flex-grow: 1 !important;
            display: flex !important;
        }

        #proxy-address {
            width: 100% !important;
            padding: 6px 10px !important;
            font-size: 14px !important;
            border: 1px solid #ccc;
            border-radius: 4px;
            outline: none;
        }

        /* Active frame viewer panel utilizing all available white spaces */
        #proxy-frame {
            width: 100% !important;
            flex-grow: 1 !important;
            border: none !important;
            height: 100% !important;
        }
    </style>
</head>
<body>

    <div class="top-navbar">
        <span class="logo">v2</span>
        <button class="nav-btn" onclick="document.getElementById('proxy-frame').contentWindow.history.back()">← Back</button>
        <button class="nav-btn" onclick="document.getElementById('proxy-frame').contentWindow.history.forward()">→</button>
        <button class="nav-btn" onclick="document.getElementById('proxy-frame').contentWindow.location.reload()">↻</button>
        
        <!-- Submission wrapper handling proxy data pipelines -->
        <form id="proxy-form" onsubmit="loadProxyUrl(event)">
            <input id="proxy-address" type="text" placeholder="Enter website address or look up searches..." autofocus required>
        </form>
    </div>

    <!-- The primary output preview viewport element -->
    <iframe id="proxy-frame" src="about:blank"></iframe>

    <script>
        function loadProxyUrl(event) {
            event.preventDefault(); // Prevents form submission from refreshing the home page
            
            let urlInput = document.getElementById('proxy-address').value.trim();
            const iframe = document.getElementById('proxy-frame');
            
            if (!urlInput) return;

            // Normalize input into an operational URL layout format
            let targetUrl = urlInput;
            if (!/^https?:\/\//i.test(urlInput)) {
                if (urlInput.includes('.') && !urlInput.includes(' ')) {
                    targetUrl = 'https://' + urlInput;
                } else {
                    targetUrl = 'https://google.com' + encodeURIComponent(urlInput);
                }
            }

            // Detect Google Search queries and pipe them into Google's official frame-friendly interface
            if (targetUrl.includes('://google.com')) {
                const searchTerms = new URL(targetUrl).searchParams.get('q');
                iframe.src = "https://www.://google.com?igu=1&q=" + encodeURIComponent(searchTerms);
            } else {
                // For regular blocked links, route through an active public proxy server gateway mirror
                iframe.src = "https://codepen.io" + encodeURIComponent(targetUrl);
                
                // Secondary absolute fail-safe unblocking sandbox mirror anchor route
                if(targetUrl.toLowerCase().includes('google.com') && !targetUrl.includes('search')){
                     iframe.src = "https://www.://google.com?igu=1";
                }
            }
        }
    </script>
</body>
</html>
