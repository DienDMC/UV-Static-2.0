<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UV Static v2</title>
    <style>
        /* Keep wide fullscreen structure fluid across screens */
        html, body {
            width: 100% !important;
            height: 100% !important;
            margin: 0 !important;
            padding: 0 !important;
            display: flex !important;
            flex-direction: column !important;
            font-family: Arial, sans-serif;
            background-color: #ffffff;
        }

        /* Top proxy configuration header structure rules */
        .top-navbar {
            display: flex !important;
            align-items: center !important;
            gap: 10px !important;
            padding: 8px 12px !important;
            border-bottom: 1px solid #e0e0e0;
            background-color: #ffffff;
            box-sizing: border-box !important;
        }

        .logo {
            font-weight: bold;
            font-size: 16px;
            color: #333;
            margin-right: 5px;
        }

        .nav-btn {
            padding: 4px 10px !important;
            font-size: 13px;
            cursor: pointer;
            border: 1px solid #ccc;
            background: #fafafa;
            border-radius: 4px;
        }

        /* Dynamic fluid growth constraints for search boxes */
        #uv-form {
            flex-grow: 1 !important;
            display: flex !important;
        }

        #uv-address {
            width: 100% !important;
            padding: 6px 10px !important;
            font-size: 14px !important;
            border: 1px solid #ccc;
            border-radius: 4px;
            outline: none;
        }

        /* Enforce edge-to-edge frame visibility mapping canvas layouts */
        #uv-frame {
            width: 100% !important;
            flex-grow: 1 !important;
            border: none !important;
            height: 100% !important;
        }
    </style>
</head>
<body>

    <div class="top-navbar">
        <span class="logo">v2</span>
        <button class="nav-btn" onclick="document.getElementById('uv-frame').contentWindow.history.back()">← Back</button>
        <button class="nav-btn" onclick="document.getElementById('uv-frame').contentWindow.history.forward()">→</button>
        <button class="nav-btn" onclick="document.getElementById('uv-frame').contentWindow.location.reload()">↻</button>
        
        <!-- Connected Proxy Processing Form Component Block -->
        <form id="uv-form" onsubmit="handleProxySearch(event)">
            <input id="uv-address" type="text" placeholder="Search Google or enter target URL..." autofocus required>
        </form>
    </div>

    <!-- Active output frame rendering targeted sites -->
    <iframe id="uv-frame"></iframe>

    <script>
        function handleProxySearch(event) {
            event.preventDefault(); 
            
            const urlInput = document.getElementById('uv-address').value.trim();
            const iframe = document.getElementById('uv-frame');
            
            if (!urlInput) return;

            // Determine if the entry is a direct link or raw search keywords
            let targetUrl = urlInput;
            if (!/^https?:\/\//i.test(urlInput) && !urlInput.includes('.')) {
                targetUrl = 'https://google.com' + encodeURIComponent(urlInput);
            } else if (!/^https?:\/\//i.test(urlInput)) {
                targetUrl = 'https://' + urlInput;
            }

            // Encode using the standard web proxy fallback translation mapping pipeline
            // This encodes the URL into an obfuscated format that doesn't trigger Vercel static 404 filters
            const cleanEncodedUrl = btoa(targetUrl).replace(/\//g, '_').replace(/\+/g, '-').replace(/=/g, '');
            
            // Route the frame natively through your deployed active directory assets
            iframe.src = window.location.origin + "/active/uv/service/" + cleanEncodedUrl;
        }
    </script>
</body>
</html>
