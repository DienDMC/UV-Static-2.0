<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UV Static v2</title>
    <style>
        /* Clean fullscreen fluid responsive container rules */
        html, body {
            width: 100% !important;
            height: 100% !important;
            margin: 0 !important;
            padding: 0 !important;
            display: flex !important;
            flex-direction: column !important;
            font-family: Arial, sans-serif;
            background-color: #ffffff;
        }

        /* Top controls address bar header configuration */
        .top-navbar {
            display: flex !important;
            align-items: center !important;
            gap: 10px !important;
            padding: 8px 12px !important;
            border-bottom: 1px solid #e0e0e0;
            background-color: #ffffff;
            box-sizing: border-box !important;
        }

        .logo {
            font-weight: bold;
            font-size: 16px;
            color: #333;
            margin-right: 5px;
        }

        .nav-btn {
            padding: 4px 10px !important;
            font-size: 13px;
            cursor: pointer;
            border: 1px solid #ccc;
            background: #fafafa;
            border-radius: 4px;
        }

        /* Fluid layout constraints for search form */
        #proxy-form {
            flex-grow: 1 !important;
            display: flex !important;
        }

        #proxy-address {
            width: 100% !important;
            padding: 6px 10px !important;
            font-size: 14px !important;
            border: 1px solid #ccc;
            border-radius: 4px;
            outline: none;
        }

        /* Enforce edge-to-edge frame scaling mapping layouts */
        #proxy-frame {
            width: 100% !important;
            flex-grow: 1 !important;
            border: none !important;
            height: 100% !important;
        }
    </style>
</head>
<body>

    <div class="top-navbar">
        <span class="logo">v2</span>
        <button class="nav-btn" onclick="document.getElementById('proxy-frame').contentWindow.history.back()">← Back</button>
        <button class="nav-btn" onclick="document.getElementById('proxy-frame').contentWindow.history.forward()">→</button>
        <button class="nav-btn" onclick="document.getElementById('proxy-frame').contentWindow.location.reload()">↻</button>
        
        <form id="proxy-form" onsubmit="loadProxyUrl(event)">
            <input id="proxy-address" type="text" placeholder="Enter target website or keywords..." autofocus required>
        </form>
    </div>

    <!-- Active output frame rendering unblocked targets -->
    <iframe id="proxy-frame" src="about:blank"></iframe>

    <script>
        function loadProxyUrl(event) {
            event.preventDefault(); 
            
            let urlInput = document.getElementById('proxy-address').value.trim();
            const iframe = document.getElementById('proxy-frame');
            
            if (!urlInput) return;

            // Formulate target strings to enforce secure web layout formats
            let targetUrl = urlInput;
            if (!/^https?:\/\//i.test(urlInput)) {
                if (urlInput.includes('.') && !urlInput.includes(' ')) {
                    targetUrl = 'https://' + urlInput;
                } else {
                    targetUrl = 'https://google.com' + encodeURIComponent(urlInput);
                }
            }

            // Using an unblocking proxy mirror gateway that bypasses X-Frame protection limits
            // This pulls the website data from an external node, stripping away the blocking headers
            if (targetUrl.includes('://google.com')) {
                // Point raw Google searches straight into the frame-friendly open container
                iframe.src = "https://www.://google.com?igu=1&q=" + targetUrl.split('?q=')[1];
            } else {
                // For direct websites like google.com, we tunnel through a public mirror engine link layer
                iframe.src = "https://googleusercontent.com" + encodeURIComponent(targetUrl);
            }
        }
    </script>
</body>
</html>
