<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UV Static v2</title>
    <link rel="stylesheet" href="style/global.css">
    <link rel="stylesheet" href="style/browser.css">
    <style>
        /* Force wide full-screen responsive spacing layouts */
        html, body {
            width: 100% !important;
            height: 100% !important;
            margin: 0 !important;
            padding: 0 !important;
            display: flex !important;
            flex-direction: column !important;
        }

        /* Permanently keep mobile-error screen block warnings invisible */
        #mobile-error, .error-overlay, p:has-text("smaller screens") {
            display: none !important;
        }

        /* Enforce edge-to-edge responsiveness on layout wrappers */
        main, #content, .container, form {
            width: 100% !important;
            box-sizing: border-box !important;
        }

        /* Stretch out your main game rendering window dynamically */
        iframe, #web-viewer, #uv-frame {
            width: 100% !important;
            flex-grow: 1 !important;
            border: none !important;
            height: 100% !important;
            background-color: #ffffff;
        }
    </style>
</head>
<body>

    <!-- Main Navigation Header Area -->
    <main>
        <form id="uv-form">
            <input id="uv-search-engine" value="https://google.com" type="hidden">
            <input id="uv-address" type="text" placeholder="Search the web freely..." autofocus required>
        </form>
    </main>

    <!-- Embedded proxy navigation window element -->
    <iframe id="uv-frame"></iframe>

    <!-- Restored authentic Ultraviolet pipeline scripts -->
    <script src="uv/uv.bundle.js" defer></script>
    <script src="uv/uv.config.js" defer></script>
    <script src="index.js" defer></script>
</body>
</html>
